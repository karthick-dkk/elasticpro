[package]
name = "elasticpro"
version.workspace = true
edition.workspace = true
description = "ElasticPro — multi-cluster Elasticsearch dashboard, direct or through a jump host"
default-run = "elasticpro"

[lib]
name = "elasticpro_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
elasticpro-core = { path = "../crates/elasticpro-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
