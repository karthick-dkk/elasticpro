name: images

# The core image of a release, built while CI tests it: a release used to wait for CI and
# then about ten minutes more for the same code to be compiled again. docker.yml takes
# what is built here when the tag's source is exactly the source built (the git tree, so a
# squash merge keeps it), and compiles as before when it is not.
#
# Only for a pull request whose version has no tag yet, and only from this repository: a
# fork's token cannot write packages. Pushed to GitHub's own registry, never to Docker Hub:
# nothing is published until the tag.
on:
  pull_request:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: is this a release
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      # The pull request merged into main, which is what a squash merge will hold.
      - uses: actions/checkout@v4
      - id: plan
        run: |
          set -euo pipefail
          version=$(tools/version.sh)
          tags=$(git ls-remote --tags origin "refs/tags/v$version")
          if [ -n "$tags" ]; then release=false; else release=true; fi
          # The day is in the name because the image is as fresh as its `apk upgrade`.
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse 'HEAD^{tree}')-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "version $version, release: $release"

  build:
    name: prebuild ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Only this job writes, and only the checkout's own Dockerfile runs in it.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: the same source as planned
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          [ "$(git rev-parse 'HEAD^{tree}')" = "${TAG%-*}" ] || { echo "::error::main moved since the plan"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          provenance: false
          push: true
          tags: ghcr.io/${{ github.repository }}-build:${{ needs.plan.outputs.tag }}-${{ matrix.arch }}
