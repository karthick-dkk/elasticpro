name: build

# Release only. Every job here produces a release artifact — the Zabbix module tarball,
# its installers, the checksum list, the release itself — and none of them is consumed
# until a tag is cut. Running them on every pull request and again on every push to main
# built things nobody downloads. Code validation lives in ci.yml, which still runs on
# both. The Docker images are built by docker.yml. Desktop builds (installers, portable
# zip) ended with 0.3.51 and are no longer produced.
on:
  push:
    # See docker.yml: a tag cut without the v prefix silently produced an empty release.
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Creating a release and uploading assets needs write access to contents. When a
# repository's default GITHUB_TOKEN is read-only — which it is here — every release
# call comes back 403 and the build looks like it failed after succeeding.
permissions:
  contents: write

# Three tag pushes left five build runs competing for the same runners. Supersede
# rather than pile up.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One definition of the version every asset name in this workflow uses. Jobs used to
  # work it out for themselves — one from Cargo.toml, another from the tag — so a tag
  # pushed before the version bump landed produced a release whose assets disagreed
  # about which build they were. Worked out once here, read by name everywhere else, and a disagreement between the
  # tag and Cargo.toml stops the run before it burns an hour of runner time.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Through env, not interpolation into the script — see docker.yml.
      - id: pick
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          # The same expression tools/zabbix-modules-tarball.sh uses, so the tool and the
          # workflow cannot read the manifest differently.
          cargo_version=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' Cargo.toml | head -1)
          [ -n "$cargo_version" ] || {
            echo "::error::no version line in the workspace Cargo.toml"; exit 1; }

          # A branch push or a pull request releases nothing, so Cargo.toml is the whole
          # answer and the version only names the uploaded build artifacts.
          if [ -z "$TAG" ]; then
            echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # tools/version.sh owns the comparison, so this workflow, docker.yml and the
          # pull-request check cannot drift apart on what "matching" means. It prints the
          # tag's version (pre-release identifier included) or fails naming the mismatch.
          want=$(tools/version.sh --tag "$TAG") || exit 1
          echo "version=$want" >> "$GITHUB_OUTPUT"

  # The Zabbix frontend modules as one archive, for deploy/zabbix/zabbix-modules-install.sh.
  # Built by the same tool a local install uses (tools/zabbix-modules-tarball.sh), so a
  # downloaded release and `--from-dir <checkout>` put the same bytes in Zabbix. Built on
  # every dispatch so a broken tool shows up before a tag; on a tag this job also CREATES
  # the release (tauri-action used to) and attaches the archive and installers to it.
  zabbix-modules:
    name: zabbix modules
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The widgets are not in this repository: they live in the modules project, and the
      # release carries the commit pinned in deploy/zabbix/MODULES_REF (first line that is
      # not a comment). Read here, then passed to the checkout as its ref.
      - name: which modules commit
        id: modules_ref
        run: |
          ref=$(grep -v '^[[:space:]]*#' deploy/zabbix/MODULES_REF | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "deploy/zabbix/MODULES_REF must hold a full 40-character commit SHA, got: $ref" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: karthick-dkk/integration-zabbix-elasticpro
          ref: ${{ steps.modules_ref.outputs.ref }}
          path: modules-src

      # MODULES_REF also names the modules version that commit carries ("# modules X.Y.Z").
      # The commit and the version move together; a pin whose manifests say something else
      # would ship modules that ElasticPro, its docs and the Settings page misname.
      - name: the pinned commit carries the modules version MODULES_REF names
        run: tools/check-modules-pin.sh --modules-src modules-src

      # The shared-code freshness check in the tarball tool runs under node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Syntax always; shellcheck (preinstalled on the runner) for errors only.
      - name: check the installer
        run: |
          bash -n deploy/zabbix/zabbix-modules-install.sh
          bash -n tools/install.sh
          python3 tools/check-zabbix-templates.py
          bash -n tools/zabbix-modules-tarball.sh
          bash -n tools/check-modules-pin.sh
          tools/check-modules-pin.sh --ref-only
          shellcheck -S error deploy/zabbix/zabbix-modules-install.sh deploy/zabbix/install-modules.sh deploy/zabbix/modules-build.sh deploy/trial-cert.sh deploy/trial-setup.sh tools/zabbix-modules-tarball.sh tools/check-modules-pin.sh tools/install.sh

      # The version comes from the version job, so every asset in the release carries the
      # same number. Through env, not interpolation into the
      # script — see docker.yml.
      - name: build the archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tools/zabbix-modules-tarball.sh --modules-src modules-src --version "$VERSION" --out dist
          # All eight modules, or the release would silently ship fewer.
          [ "$(tar -tzf dist/elasticpro-zabbix-modules-*.tar.gz | grep -c '/manifest.json$')" = 8 ] \
            || { echo "the archive must carry eight modules" >&2; exit 1; }
          cp deploy/zabbix/zabbix-modules-install.sh dist/
          # The product's own installer, so both are fetched the same way — from the
          # release rather than from whatever is on main at the time.
          cp tools/install.sh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: zabbix-modules
          path: dist/*
          if-no-files-found: error

      # Creates the release on a tag (and only on a tag — a branch dispatch makes none).
      # A tag with a hyphen in it — v0.2.0-beta — is a pre-release, which keeps it off the
      # "Latest release" badge.
      - name: create the release and attach the Zabbix modules
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ElasticPro ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Multi-cluster Elasticsearch dashboard — direct or through an SSH jump host.

            **This release carries**

            - The Docker images on Docker Hub, tagged with this release:
              `karthickdk02/elasticpro-core`, `-nginx`, `-redis`, `-postgres`
              (amd64 and arm64 for the core). Install with `install.sh` (hosted Docker
              stack, the default).
            - The Zabbix modules: `elasticpro-zabbix-modules-*.tar.gz`, its `.sha256`,
              and `zabbix-modules-install.sh`.
            - `SHA256SUMS.txt` covering every file attached here.

            Desktop builds (Windows, macOS, Linux installers and the portable zip) ended
            with 0.3.51 and are not part of this release. The last ones are on the
            [0.3.51 release](https://github.com/karthick-dkk/elasticpro/releases/tag/v0.3.51).

            See [CHANGELOG.md](https://github.com/karthick-dkk/elasticpro/blob/main/CHANGELOG.md)
            for what changed.
          files: |
            dist/elasticpro-zabbix-modules-*.tar.gz
            dist/elasticpro-zabbix-modules-*.tar.gz.sha256
            dist/zabbix-modules-install.sh
            dist/install.sh

  # Two things no single producer job can do: say whether the release ended up carrying
  # every asset, and publish one checksum list covering all of them. SECURITY.md tells
  # people to check SHA256SUMS.txt, and a missing asset is only visible if something
  # names it.
  #
  # always(), so a release that is short an asset says which one instead of this job being
  # skipped along with the job that failed.
  release-assets:
    name: release checksums
    needs: [zabbix-modules]
    if: ${{ always() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No checkout: gh talks to the release over the API and nothing here reads the tree.
      - name: check the release is complete, then publish its checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # This job runs even when a producer failed, so the release may not exist at all.
          # Say that in one line rather than letting gh fail with "release not found".
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            echo "::error::no release for $TAG — the zabbix modules job creates it and did not get that far"
            exit 1
          }
          mkdir -p assets
          # Not fatal on its own: an empty release makes this exit non-zero, and the
          # check below is what names what is missing.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets --clobber || true
          # A re-run would otherwise hash the list it published last time into the new one.
          rm -f assets/SHA256SUMS.txt
          cd assets

          # What a complete release looks like. The archive and its checksum are what
          # zabbix-modules-install.sh downloads; install.sh is the product installer.
          missing=()
          for pat in 'elasticpro-zabbix-modules-*.tar.gz' \
                     'elasticpro-zabbix-modules-*.tar.gz.sha256' \
                     'zabbix-modules-install.sh' 'install.sh'; do
            # shellcheck disable=SC2086
            set -- $pat
            [ -e "$1" ] || missing+=("$pat")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::release $TAG has no $m"; done
            echo "::error::the zabbix modules job failed or changed a file name — do not announce this release"
            exit 1
          fi

          # One line per asset, in the format sha256sum -c reads, so verifying a download
          # is `sha256sum --ignore-missing -c SHA256SUMS.txt` and nothing more.
          sha256sum -- * > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          gh release upload "$TAG" ../SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

          {
            echo "### Release $TAG"
            echo ""
            echo '```'
            cat ../SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
