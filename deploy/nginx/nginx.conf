# ElasticPro — the front door. TLS, the auth gate, and the only path to the core.
#
# Fleet at Scale (100-300 clusters): one worker per core, a bigger connection table, a
# keepalive pool to the core instead of a fresh TCP connection per /bridge call, gzip on
# the JSON that call returns, and two limits sized against real traffic — not a guess —
# so a runaway script or a stuck browser tab hits nginx before it hits the core.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Access log in a shape a collector can parse; the core's audit log is separate.
  log_format main escape=json
    '{"time":"$time_iso8601","user":"$remote_user","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"ms":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Every /bridge call and the static UI go to the same place; naming it once means every
  # location below reuses the same pool of already-open connections instead of a new
  # TCP (and TLS-free but still SYN/ACK) handshake per request.
  upstream core {
    server core:8765;
    keepalive 64;
  }

  # The bridge's replies (and the UI's own JS/CSS) are JSON/text and compress well; the
  # SSE stream at /events turns buffering and caching off on its own, below, so this is
  # safe to leave on globally.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json;

  # /bridge is the one JSON-RPC endpoint everything in the app calls. Sized against real
  # traffic, not a round number: after the fleet cache work a refresh is FLEET_STATE plus
  # maybe a REFRESH or a CLUSTER_DATASET — a handful of calls, nowhere near 20/s even with
  # several tabs open. The burst covers a page load (several calls at once) and the 60 s
  # SSE-fallback poll landing alongside a manual refresh; nodelay so a normal user is
  # queued for milliseconds, not throttled to a crawl.
  limit_req_zone $binary_remote_addr zone=bridge:10m rate=20r/s;
  # /events (below) is a long-lived stream, not a burst of requests, so it gets a
  # connection cap per address instead of a request-rate limit.
  limit_conn_zone $binary_remote_addr zone=events:10m;
  # The two server-to-server routes from the Zabbix module. Both are HMAC-signed, and the
  # core has its own per-source budget too; these stop a flood before it reaches it.
  # Pairing happens once in a blue moon: ten a minute is generous. Sign-in is every person
  # opening ElasticPro from Zabbix — all from the one Zabbix frontend address — so it
  # gets more room.
  limit_req_zone $binary_remote_addr zone=zbxpair:1m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=zbxsso:1m  rate=60r/m;
  # 429, not nginx's default 503: a client over its budget must be told so, not shown what
  # looks like the core being down.
  limit_req_status  429;
  limit_conn_status 429;

  # Plain HTTP is never served; there is nothing to redirect because 80 is not exposed.
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- authentication ------------------------------------------------------------
    # There is no auth_basic here any more. The core has its own accounts now: a fresh
    # deployment asks for an administrator on first run, and everyone signs in against
    # them with a per-user role. Keeping basic auth in front of that meant signing in
    # twice to reach one application, with the two identities unrelated to each other —
    # the nginx user and the app user were different people as far as the audit log knew.
    #
    # To authenticate at the edge instead — oauth2-proxy, an IdP, or basic auth again —
    # put it back and have it set X-Auth-User. The core accepts that header and grants
    # whatever role that name has an account for. It is one of three ways in, not the
    # only one, and a name with no account behind it still gets nothing.
    #
    # Anything served from this server block that is NOT the app is now public. There is
    # nothing else in it today; if you add the /automation.json location from
    # deploy/zabbix/README.md, give that location its own auth_basic or serve it from the
    # core with an API token, or the fleet's index names are readable by anyone.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Who may show this app inside a frame is the CORE's answer now, not this file's: it
    # sends `Content-Security-Policy: frame-ancestors <paired Zabbix origin>` — or 'none'
    # when it is not paired — on every response. Do not add a frame-ancestors header here:
    # a browser enforces every CSP header it receives, so a second one from nginx would
    # silently override the pairing. To pin it by hand instead, set ELASTICPRO_FRAME_ANCESTORS
    # on the core (it wins over the pairing). X-Frame-Options stays out for the same
    # reason as before: it cannot name another site.

    # Zabbix → ElasticPro, server to server: sign-in and pairing. Both are signed with
    # HMAC-SHA256 (X-Zabbix-Module-Signature), time-boxed and replay-proof; the core may
    # also limit them to allowedSources (Config → Zabbix), which is why X-Real-IP is set.
    # These two exact paths are forwarded — nothing else under /sso/.
    location = /sso/zabbix {
      limit_req            zone=zbxsso burst=30 nodelay;
      client_max_body_size 64k;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      # Nobody is signed in on these routes; never let a caller claim to be.
      proxy_set_header     X-Auth-User "";
    }
    location = /zabbix/pair {
      limit_req            zone=zbxpair burst=5 nodelay;
      client_max_body_size 64k;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      proxy_set_header     X-Auth-User "";
    }
    location ^~ /sso/ {
      return 404;
    }

    # The fleet's push channel: EVENTS_TICKET mints a single-use ticket, the client opens
    # GET /events?ticket=... and holds it open for as long as the tab is. Buffering or
    # caching it would turn "push" back into "poll once the buffer flushes", and the
    # default proxy timeouts would cut a quiet-but-healthy connection well before an hour.
    location = /events {
      proxy_pass          http://core;
      proxy_http_version  1.1;
      proxy_set_header    Connection "";
      proxy_buffering     off;
      proxy_cache         off;
      proxy_read_timeout  1h;
      proxy_send_timeout  1h;
      # Per address, not per user — nginx has no notion of the app's accounts. Eight is
      # room for several tabs and a phone and a laptop at once, not a fleet of scripts.
      limit_conn          events 8;
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header    X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header   X-Auth-User;
    }

    # The one JSON-RPC endpoint: every ES call, every FLEET_STATE/REFRESH/CLUSTER_DATASET,
    # every write. limit_req sits only here, not on the static UI, so loading the app
    # itself never counts against a fleet-sized client's request budget.
    location = /bridge {
      limit_req            zone=bridge burst=40 nodelay;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_read_timeout   120s;     # a long snapshot _status can take a while
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header     X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header    X-Auth-User;
    }

    location / {
      proxy_pass         http://core;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_read_timeout 120s;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header   X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header  X-Auth-User;
    }
  }
}
