# ElasticPro — the front door. TLS, the auth gate, and the only path to the core.
#
# Fleet at Scale (100-300 clusters): one worker per core, a bigger connection table, a
# keepalive pool to the core instead of a fresh TCP connection per /bridge call, gzip on
# the JSON that call returns, and two limits sized against real traffic — not a guess —
# so a runaway script or a stuck browser tab hits nginx before it hits the core.
worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Access log in a shape a collector can parse; the core's audit log is separate.
  log_format main escape=json
    '{"time":"$time_iso8601","user":"$remote_user","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes":$body_bytes_sent,"ms":$request_time,"ua":"$http_user_agent"}';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Every /bridge call and the static UI go to the same place; naming it once means every
  # location below reuses the same pool of already-open connections instead of a new
  # TCP (and TLS-free but still SYN/ACK) handshake per request.
  upstream core {
    server core:8765;
    keepalive 64;
  }

  # The bridge's replies (and the UI's own JS/CSS) are JSON/text and compress well; the
  # SSE stream at /events turns buffering and caching off on its own, below, so this is
  # safe to leave on globally.
  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json;

  # /bridge is the one JSON-RPC endpoint everything in the app calls. Sized against real
  # traffic, not a round number: after the fleet cache work a refresh is FLEET_STATE plus
  # maybe a REFRESH or a CLUSTER_DATASET — a handful of calls, nowhere near 20/s even with
  # several tabs open. The burst covers a page load (several calls at once) and the 60 s
  # SSE-fallback poll landing alongside a manual refresh; nodelay so a normal user is
  # queued for milliseconds, not throttled to a crawl.
  # Addresses that are not rate limited at all. The Zabbix server belongs here: every
  # person using ElasticPro from inside Zabbix arrives from that one frontend address, so
  # a per-address budget is one budget shared by all of them — the busier the install, the
  # sooner they throttle each other, which is the opposite of what the limit is for. The
  # traffic from it is HMAC-signed or SSO-authenticated before it reaches anything.
  #
  # List the addresses in a .conf file under nginx/rate-exempt/, one `<cidr> 1;` per line.
  # Empty by default: with nothing listed every client is limited exactly as before.
  #
  # A directory of .conf files rather than one file, because of what an upgrade does. The
  # compose file bind-mounts this path; if a deployment made before this release has no
  # such entry on disk, Docker creates one — and for a file mount that means a DIRECTORY,
  # which nginx then refuses to read ("pread() ... failed (21: Is a directory)") and the
  # edge never starts. A wildcard include that matches nothing is not an error, so an
  # upgraded deployment with an empty directory here simply keeps its old behaviour.
  geo $ep_rl_exempt {
    default 0;
    include /etc/nginx/rate-exempt/*.conf;
  }
  # An empty key switches limit_req and limit_conn off for that request — nginx does not
  # count a request whose key is the empty string. Every other client still keys on its
  # address, so one exempt address cannot lift the limit for anybody else.
  map $ep_rl_exempt $ep_rl_key {
    0 $binary_remote_addr;
    1 "";
  }

  # /bridge: a flood guard only, per address, set far above what any number of people behind
  # one proxy refreshing a large fleet send. It used to be 20/s with a burst of 40, which a
  # page refreshing every cluster passed for a second at a time — an error that came and went
  # on every page. Trusted addresses (rate-exempt above) are not counted at all.
  limit_req_zone $ep_rl_key zone=bridge:10m rate=500r/s;
  # /events (below) is a long-lived stream, not a burst of requests, so it gets a
  # connection cap per address instead of a request-rate limit.
  limit_conn_zone $ep_rl_key zone=events:10m;
  # The two server-to-server routes from the Zabbix module. Both are HMAC-signed, and the
  # core has its own per-source budget too; these stop a flood before it reaches it.
  # Pairing happens once in a blue moon: ten a minute is generous. Sign-in is every person
  # opening ElasticPro from Zabbix — all from the one Zabbix frontend address — so it
  # gets more room.
  limit_req_zone $ep_rl_key zone=zbxpair:1m rate=10r/m;
  limit_req_zone $ep_rl_key zone=zbxsso:1m  rate=600r/m;
  # 429, not nginx's default 503: a client over its budget must be told so, not shown what
  # looks like the core being down.
  limit_req_status  429;
  limit_conn_status 429;

  # Who may open the UI, and under which name. Both are generated from config.txt by
  # deploy.sh (ALLOWED_UI_IPS, ALLOWED_DOMAINS) into the two directories below, and both
  # follow the rate-exempt pattern above for the same reason: a directory mount that is
  # empty or missing matches no *.conf, so a deployment that sets nothing behaves exactly
  # as it did before — everyone, under any name.
  #
  # allow-ui/ holds the whole address space as four halves (0.0.0.0/1, 128.0.0.0/1, ::/1,
  # 8000::/1), all 0, followed by each listed `<cidr> 1;`. geo takes the most specific match,
  # so a listed address beats the halves and everything else lands on 0 — an allow-list
  # written as a block-list with exceptions. Halves rather than 0.0.0.0/0 because geo
  # reads `default` as exactly that network, and a second /0 is a duplicate it warns about.
  geo $ep_ui_allowed {
    default 1;
    include /etc/nginx/allow-ui/*.conf;
  }
  # allow-host/ holds `<name> 1;` for each allowed name and then a final `~^ 0;`. map tries
  # exact names before regular expressions, so a listed name is 1 and any other name —
  # even an empty one — falls through to the regex and is 0.
  map $host $ep_host_ok {
    default 1;
    include /etc/nginx/allow-host/*.conf;
  }

  # Plain HTTP is never served; there is nothing to redirect because 80 is not exposed.
  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ---- authentication ------------------------------------------------------------
    # There is no auth_basic here any more. The core has its own accounts now: a fresh
    # deployment asks for an administrator on first run, and everyone signs in against
    # them with a per-user role. Keeping basic auth in front of that meant signing in
    # twice to reach one application, with the two identities unrelated to each other —
    # the nginx user and the app user were different people as far as the audit log knew.
    #
    # To authenticate at the edge instead — oauth2-proxy, an IdP, or basic auth again —
    # put it back and have it set X-Auth-User. The core accepts that header and grants
    # whatever role that name has an account for. It is one of three ways in, not the
    # only one, and a name with no account behind it still gets nothing.
    #
    # Anything served from this server block that is NOT the app is now public. There is
    # nothing else in it today; if you add the /automation.json location from
    # deploy/zabbix/README.md, give that location its own auth_basic or serve it from the
    # core with an API token, or the fleet's index names are readable by anyone.

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Who may show this app inside a frame is the CORE's answer now, not this file's: it
    # sends `Content-Security-Policy: frame-ancestors <paired Zabbix origin>` — or 'none'
    # when it is not paired — on every response. Do not add a frame-ancestors header here:
    # a browser enforces every CSP header it receives, so a second one from nginx would
    # silently override the pairing. To pin it by hand instead, set ELASTICPRO_FRAME_ANCESTORS
    # on the core (it wins over the pairing). X-Frame-Options stays out for the same
    # reason as before: it cannot name another site.

    # These two routes skip the address and name checks below on purpose: they come from the
    # Zabbix server, not from a person, and the core limits them to allowedSources.
    # Zabbix → ElasticPro, server to server: sign-in and pairing. Both are signed with
    # HMAC-SHA256 (X-Zabbix-Module-Signature), time-boxed and replay-proof; the core may
    # also limit them to allowedSources (Config → Zabbix), which is why X-Real-IP is set.
    # These two exact paths are forwarded — nothing else under /sso/.
    location = /sso/zabbix {
      limit_req            zone=zbxsso burst=300 nodelay;
      client_max_body_size 64k;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      # Nobody is signed in on these routes; never let a caller claim to be.
      proxy_set_header     X-Auth-User "";
    }
    location = /zabbix/pair {
      limit_req            zone=zbxpair burst=5 nodelay;
      client_max_body_size 64k;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      proxy_set_header     X-Auth-User "";
    }
    location ^~ /sso/ {
      return 404;
    }

    # The fleet's push channel: EVENTS_TICKET mints a single-use ticket, the client opens
    # GET /events?ticket=... and holds it open for as long as the tab is. Buffering or
    # caching it would turn "push" back into "poll once the buffer flushes", and the
    # default proxy timeouts would cut a quiet-but-healthy connection well before an hour.
    location = /events {
      # Who may open ElasticPro, and under which name (ep_host_ok / ep_ui_allowed, above).
      # Only if + return in here, which is the one use of `if` that is safe in a location;
      # it runs before the rate limit, so a refused request is not counted against anyone.
      if ($ep_host_ok = 0)    { return 421; }
      if ($ep_ui_allowed = 0) { return 403; }
      proxy_pass          http://core;
      proxy_http_version  1.1;
      proxy_set_header    Connection "";
      proxy_buffering     off;
      proxy_cache         off;
      proxy_read_timeout  1h;
      proxy_send_timeout  1h;
      # Per address, not per user — nginx has no notion of the app's accounts — so a whole
      # office behind one NAT shares it: room for that (it was 8), still a cap on a runaway.
      limit_conn          events 200;
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header    X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header   X-Auth-User;
    }

    # The one JSON-RPC endpoint: every ES call, every FLEET_STATE/REFRESH/CLUSTER_DATASET,
    # every write. limit_req sits only here, not on the static UI, so loading the app
    # itself never counts against a fleet-sized client's request budget.
    location = /bridge {
      # Who may open ElasticPro, and under which name (ep_host_ok / ep_ui_allowed, above).
      # Only if + return in here, which is the one use of `if` that is safe in a location;
      # it runs before the rate limit, so a refused request is not counted against anyone.
      if ($ep_host_ok = 0)    { return 421; }
      if ($ep_ui_allowed = 0) { return 403; }
      limit_req            zone=bridge burst=2000 nodelay;
      # nginx's own answers here are JSON like the core's, not an HTML page the UI cannot
      # read (it said "Unexpected token '<'").
      error_page 429 = @bridge_429;
      error_page 502 503 = @bridge_down;
      error_page 504 = @bridge_slow;
      error_page 403 = @bridge_forbidden;
      error_page 421 = @bridge_wrong_host;
      proxy_pass           http://core;
      proxy_http_version   1.1;
      proxy_set_header     Connection "";
      proxy_read_timeout   120s;     # a long snapshot _status can take a while
      proxy_set_header     Host $host;
      proxy_set_header     X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header     X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header    X-Auth-User;
    }

    location @bridge_429 {
      default_type application/json;
      add_header Retry-After 1 always;
      return 429 '{"ok":false,"kind":"proxy_rate_limited","message":"too many requests per second from this address — slowed down; it clears by itself"}';
    }
    location @bridge_forbidden {
      default_type application/json;
      return 403 '{"ok":false,"kind":"forbidden_address","message":"this address may not open ElasticPro — ALLOWED_UI_IPS in config.txt"}';
    }
    location @bridge_wrong_host {
      default_type application/json;
      return 421 '{"ok":false,"kind":"forbidden_host","message":"ElasticPro does not answer to this name — ALLOWED_DOMAINS in config.txt"}';
    }
    location @bridge_down {
      default_type application/json;
      return 502 '{"ok":false,"kind":"core_unavailable","message":"the ElasticPro core is not answering nginx (restarting, or stopped)"}';
    }
    location @bridge_slow {
      default_type application/json;
      return 504 '{"ok":false,"kind":"core_timeout","message":"the ElasticPro core took longer than nginx waits (120 s) to answer"}';
    }

    location / {
      # Who may open ElasticPro, and under which name (ep_host_ok / ep_ui_allowed, above).
      # Only if + return in here, which is the one use of `if` that is safe in a location;
      # it runs before the rate limit, so a refused request is not counted against anyone.
      if ($ep_host_ok = 0)    { return 421; }
      if ($ep_ui_allowed = 0) { return 403; }
      proxy_pass         http://core;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
      proxy_read_timeout 120s;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      # The identity the core trusts. Set here, after auth, and nowhere else.
      proxy_set_header   X-Auth-User $remote_user;
      # Never let a client supply it.
      proxy_hide_header  X-Auth-User;
    }
  }
}
