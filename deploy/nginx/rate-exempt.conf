# Addresses nginx does not rate limit, one per line, in `geo` syntax:
#
#   192.0.2.10/32 1;        # the Zabbix frontend
#   10.0.0.0/24   1;        # a whole management subnet
#
# The Zabbix server is the usual entry. Everyone who opens ElasticPro from inside Zabbix
# arrives from that single address, so the per-address budget in nginx.conf is shared by
# all of them at once; listing it here gives each of those people the room they would
# have had coming in directly.
#
# This removes the rate limit for the addresses listed, nothing else. They still pass
# every authentication and signature check. Do not list an address you do not control.
#
# Empty by default: with no entry here, every client is rate limited as before.
#
# One caveat: tools/hosted-check.sh asserts that /zabbix/pair answers 429 once it is over
# its budget. Exempt the address that script runs from and that check fails — correctly,
# because the limit really is off for it. Run the check from an address not listed here.
