# Generated by tools/zabbix-plan-template.mjs from CLIENT_COLUMNS — do not edit by hand.
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 68e9f34e33134d7bad752f21360f77de
      name: Templates/Applications
  templates:
    - uuid: 2b0b5bdb9c08405d8048b7bcb499f202
      template: 'ElasticPro client plan'
      name: 'ElasticPro client plan'
      description: 'The Volume report''s Client plan for the cluster this host is, pushed by tools/elasticpro-scrape.mjs --send. Link it to cluster hosts (or into the cluster template). Values Elasticsearch cannot give are not sent: a gap is "unknown", never zero.'
      vendor:
        name: ElasticPro
        version: 7.0-2
      groups:
        - name: Templates/Applications
      items:
        - uuid: 9f3094d0791a4da2838cbcf552e7a2c1
          name: 'Client plan: last update'
          type: TRAP
          key: elasticpro.plan.epoch
          value_type: UNSIGNED
          units: unixtime
          description: 'When the scraper last pushed the plan. A scraper that stopped looks like a steady fleet otherwise.'
          tags:
            - tag: component
              value: client-plan
          triggers:
            - uuid: e1bc21c62993471e8876bb8d2507955e
              expression: 'nodata(/ElasticPro client plan/elasticpro.plan.epoch,{$ELASTICPRO.PLAN.STALE})=1'
              name: 'Client plan: no update for {$ELASTICPRO.PLAN.STALE} — every figure is old'
              priority: WARNING
        - uuid: 82dd866d287842e294a6d54d440705c5
          name: 'Client plan: cluster reachable'
          type: TRAP
          key: elasticpro.plan.reachable
          value_type: UNSIGNED
          tags:
            - tag: component
              value: client-plan
          triggers:
            - uuid: acfc188dc8344c4e9cd639451cb50d1f
              expression: 'last(/ElasticPro client plan/elasticpro.plan.reachable)=0'
              name: 'Client plan: cluster unreachable — the plan cannot be measured'
              priority: AVERAGE
        - uuid: 7c292fe9d34f4fa688623360e320895b
          name: 'Client plan: ES Host'
          type: TRAP
          key: 'elasticpro.plan[es.host]'
          value_type: CHAR
          trends: '0'
          description: 'Where the app connects. For a cluster behind a jump host this is the address as the jump host resolves it.'
          tags:
            - tag: column
              value: '01'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Client'
        - uuid: 644c0e17cd4f4a1e92bd0d1cb33682ea
          name: 'Client plan: Current Per Day Volume'
          type: TRAP
          key: 'elasticpro.plan[volume.day]'
          value_type: FLOAT
          units: '!GB'
          description: 'How much the indices grow in a day: the average of the heaviest days in the window, both set in the config (volumeTopDays of volumeWindowDays, 3 of 7 by default). Heaviest-few rather than a plain average so a quiet weekend does not make the estimate too small. Today is left out because it is still being written to.'
          tags:
            - tag: column
              value: '02'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Volume'
        - uuid: d538609424534910ba024b3192067825
          name: 'Client plan: Daily Volume + buffer'
          type: TRAP
          key: 'elasticpro.plan[volume.day.buffered]'
          value_type: FLOAT
          units: '!GB'
          description: 'The daily figure plus the configured headroom (volumeHeadroomPercent, 30% by default). Every "needed" and "required" number on this row is this figure multiplied by a number of days.'
          tags:
            - tag: column
              value: '03'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Volume'
        - uuid: bef1aa2ecc1b4fa4b3f627dbcfc11925
          name: 'Client plan: Current Live Storage'
          type: TRAP
          key: 'elasticpro.plan[live.total]'
          value_type: FLOAT
          units: '!GB'
          description: 'Total disk across the data nodes, as Elasticsearch reports it.'
          tags:
            - tag: column
              value: '04'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: 688cf20ccc9e4ebea1d59a51f386fe1b
          name: 'Client plan: Live Used'
          type: TRAP
          key: 'elasticpro.plan[live.used.pct]'
          value_type: FLOAT
          units: '%'
          description: 'How full that disk is now. The warning and critical thresholds come from the config.'
          tags:
            - tag: column
              value: '05'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: 01682e2b4b594fc49e55a27b2d548685
          name: 'Client plan: Current Live Storage Store Upto'
          type: TRAP
          key: 'elasticpro.plan[live.days]'
          value_type: FLOAT
          units: '!days'
          description: 'Disk free ÷ indices size per day. How long until the cluster fills at today''s rate, assuming nothing is deleted. Uses the unbuffered daily figure, because it is a projection of what is happening rather than a plan.'
          tags:
            - tag: column
              value: '06'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: c82e4bab64ca437f9ae6e1f92dcdd232
          name: 'Client plan: Required Live Storage for 30days'
          type: TRAP
          key: 'elasticpro.plan[live.required.30d]'
          value_type: FLOAT
          units: '!GB'
          description: 'Indices size per day, plus the configured headroom, × 30.'
          tags:
            - tag: column
              value: '07'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: 6d42f5fcfb0c495ebd0dbc0491f40129
          name: 'Client plan: Required Live Storage for 90days'
          type: TRAP
          key: 'elasticpro.plan[live.required.90d]'
          value_type: FLOAT
          units: '!GB'
          description: 'Indices size per day, plus the configured headroom, × 90.'
          tags:
            - tag: column
              value: '08'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: 82dd7f8356134a658bb7329389f71372
          name: 'Client plan: Live Indices From'
          type: TRAP
          key: 'elasticpro.plan[live.from]'
          value_type: CHAR
          trends: '0'
          description: 'The earliest day found in the index names on the cluster.'
          tags:
            - tag: column
              value: '09'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: 49f7c29df410433c9f967b26804f73b6
          name: 'Client plan: Live Indices To'
          type: TRAP
          key: 'elasticpro.plan[live.to]'
          value_type: CHAR
          trends: '0'
          description: 'The latest day found in the index names on the cluster.'
          tags:
            - tag: column
              value: '10'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Live storage'
        - uuid: a4b5ade0bed246ff864a5cd669f2181f
          name: 'Client plan: Current Backup Storage'
          type: TRAP
          key: 'elasticpro.plan[backup.total]'
          value_type: FLOAT
          units: '!GB'
          description: 'The total size of the snapshot repository. Elasticsearch has no API for this — a repository is a mount point or a bucket, and only you know how big it is — so it comes from backupCapacity in the cluster config, written as "2TB", "500 GB" or a bare number of GB.'
          tags:
            - tag: column
              value: '11'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
        - uuid: dd1a49bdba92488d951d6ba0785d47fc
          name: 'Client plan: Backup Storage Type'
          type: TRAP
          key: 'elasticpro.plan[backup.type]'
          value_type: CHAR
          trends: '0'
          description: 'The repository type and location — shared filesystem, S3, and so on.'
          tags:
            - tag: column
              value: '12'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
        - uuid: 42257284c7004b5da85fb9912f631ea7
          name: 'Client plan: Required Backup Storage for 365 days'
          type: TRAP
          key: 'elasticpro.plan[backup.required.365d]'
          value_type: FLOAT
          units: '!GB'
          description: 'Indices size per day, plus the configured headroom, × 365 — a year of backups. An upper bound, for the same reason.'
          tags:
            - tag: column
              value: '13'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
        - uuid: af91de49f66a4d2f96b466a8819c7b0a
          name: 'Client plan: Current Backup storage Store upto'
          type: TRAP
          key: 'elasticpro.plan[backup.days]'
          value_type: FLOAT
          units: '!days'
          description: 'Backup space used ÷ indices size per day. A rough sense of how much data the repository holds. It is an estimate from sizes; the two columns that follow are read from the actual dates.'
          tags:
            - tag: column
              value: '14'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
        - uuid: 1c1d07d5867d47948a215db993a4c38d
          name: 'Client plan: Snapshot Indices From'
          type: TRAP
          key: 'elasticpro.plan[backup.from]'
          value_type: CHAR
          trends: '0'
          description: 'The earliest day of data held inside any snapshot, read from the dates in the index names it contains. This is not the date the snapshot ran.'
          tags:
            - tag: column
              value: '15'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
        - uuid: 2b79ba5db2a74e4b8a92251a7dfe840c
          name: 'Client plan: Snapshot Indices To'
          type: TRAP
          key: 'elasticpro.plan[backup.to]'
          value_type: CHAR
          trends: '0'
          description: 'The latest day of data held inside any snapshot.'
          tags:
            - tag: column
              value: '16'
            - tag: component
              value: client-plan
            - tag: plan
              value: 'Backup storage'
      tags:
        - tag: class
          value: software
        - tag: target
          value: elasticsearch
      macros:
        - macro: '{$ELASTICPRO.PLAN.LIVE_DAYS.MIN}'
          value: '14'
          description: 'Warn when live storage fills in fewer days than this.'
        - macro: '{$ELASTICPRO.PLAN.LIVE_USED.WARN}'
          value: '85'
          description: 'Warn when live storage is more than this percent used.'
        - macro: '{$ELASTICPRO.PLAN.STALE}'
          value: '30m'
          description: 'Complain when the scraper has not pushed for this long.'
  triggers:
    - uuid: 0c2edd0fd972437ba9e0add3aa9844bf
      expression: 'last(/ElasticPro client plan/elasticpro.plan[live.used.pct])>{$ELASTICPRO.PLAN.LIVE_USED.WARN}'
      name: 'Client plan: live storage over {$ELASTICPRO.PLAN.LIVE_USED.WARN}% used'
      priority: WARNING
    - uuid: 7bc82db9e01c44989b37178a62154135
      expression: 'last(/ElasticPro client plan/elasticpro.plan[live.days])<{$ELASTICPRO.PLAN.LIVE_DAYS.MIN}'
      name: 'Client plan: live storage fills in under {$ELASTICPRO.PLAN.LIVE_DAYS.MIN} days at the current rate'
      priority: HIGH
    - uuid: 2ec944119c67437d97409189476119d9
      expression: 'last(/ElasticPro client plan/elasticpro.plan[live.total])<last(/ElasticPro client plan/elasticpro.plan[live.required.30d])'
      name: 'Client plan: not enough live storage for 30 days of indices'
      priority: WARNING
    - uuid: d58da8dd3f1b4a078e828bfcc58f3aac
      expression: 'last(/ElasticPro client plan/elasticpro.plan[backup.total])<last(/ElasticPro client plan/elasticpro.plan[backup.required.365d])'
      name: 'Client plan: backup storage below what 365 days of snapshots needs'
      priority: INFO
  graphs:
    - uuid: 3b25613703604addac5f17caa55124c1
      name: 'Client plan: volume per day'
      graph_items:
        - sortorder: '0'
          color: 1A7C11
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[volume.day]'
        - sortorder: '1'
          color: F63100
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[volume.day.buffered]'
    - uuid: 9f1b45f403ef45628b323811871bfc6b
      name: 'Client plan: live storage against need'
      graph_items:
        - sortorder: '0'
          color: 1A7C11
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[live.total]'
        - sortorder: '1'
          color: F63100
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[live.required.30d]'
        - sortorder: '2'
          color: 2774A4
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[live.required.90d]'
    - uuid: 85829e8883f844f7b8c8b82269861f2e
      name: 'Client plan: days of storage left'
      graph_items:
        - sortorder: '0'
          color: 1A7C11
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[live.days]'
        - sortorder: '1'
          color: F63100
          item:
            host: 'ElasticPro client plan'
            key: 'elasticpro.plan[backup.days]'
